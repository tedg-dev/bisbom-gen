# bomtrace_go.conf — bomtrace2 configuration for Go builds
#
# Go's internal compiler toolchain (/usr/local/go/pkg/tool/linux_amd64/compile
# and link) must be explicitly watched because bomtrace does not auto-detect
# them.  The openat syscall is also required (Go tools use openat, not just
# execve).  See: https://github.com/omnibor/bomsh#software-vulnerability-cve-search-for-golang-packages
#
# IMPORTANT: go build -a is required to bypass the Go build cache so that
# bomtrace2 captures all compilation steps.

hook_script_file=/tmp/bomsh_hook2.py
hook_script_cmdopt=-vv -n -w /usr/local/go/pkg/tool/linux_amd64/compile,/usr/local/go/pkg/tool/linux_amd64/link > /dev/null 2>&1 < /dev/null
shell_cmd_file=/tmp/bomsh_cmd

logfile=/tmp/bomsh_hook_bomtrace_logfile
raw_logfile=/tmp/bomsh_hook_raw_logfile.sha1

# What additional syscalls to intercept.
# Go tools use openat — without this, bomtrace2 sees no file I/O.
syscalls=openat
