services:
  # --------------------------------------------------------
  # Standalone: full image with toolchains + bomtrace
  # Usage: docker compose up omnibor-standalone
  # --------------------------------------------------------
  omnibor-standalone:
    # REQUIRED: bomtrace3 needs x86 (sys/reg.h). Uses QEMU on Apple Silicon.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: standalone
    image: omnibor-env:standalone
    container_name: omnibor-analysis
    volumes:
      - ../repos:/workspace/repos
      - ../output:/workspace/output
      - ../app:/workspace/app
      - ../docs:/workspace/docs
      # Persist Maven/Gradle caches across ephemeral runs so
      # dependencies/plugins are downloaded once, not per run.
      - maven-cache:/root/.m2
      - gradle-cache:/root/.gradle
    working_dir: /workspace
    stdin_open: true
    tty: true
    # Bomtrace requires ptrace capability
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # --------------------------------------------------------
  # Sidecar: minimal image (no toolchains, no SYS_PTRACE)
  # Usage: docker compose up omnibor-sidecar
  # --------------------------------------------------------
  omnibor-sidecar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: sidecar
    image: omnibor-env:sidecar
    container_name: omnibor-sidecar
    volumes:
      - ../repos:/workspace/repos
      - ../output:/workspace/output
      - ../app:/workspace/app
      - ../docs:/workspace/docs
      # Persist Maven/Gradle caches across ephemeral runs so
      # dependencies/plugins are downloaded once, not per run.
      - maven-cache:/root/.m2
      - gradle-cache:/root/.gradle
    working_dir: /workspace
    stdin_open: true
    tty: true

  # --------------------------------------------------------
  # Default (backward compatible alias for standalone)
  # Usage: docker compose up omnibor-env
  # --------------------------------------------------------
  omnibor-env:
    extends:
      service: omnibor-standalone

  # --------------------------------------------------------
  # RHEL 9 (Rocky): integration testing for RpmResolver
  # Usage: docker compose run --rm omnibor-rhel pytest ...
  # --------------------------------------------------------
  omnibor-rhel:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.rhel
    image: omnibor-env:rhel9
    volumes:
      - ../app:/workspace/app:ro
      - ../tests:/workspace/tests:ro
      - ../repos:/workspace/repos
      - ../output:/workspace/output
    working_dir: /workspace

  # --------------------------------------------------------
  # Alpine 3.19: integration testing for ApkResolver
  # Usage: docker compose run --rm omnibor-alpine pytest ...
  # --------------------------------------------------------
  omnibor-alpine:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.alpine
    image: omnibor-env:alpine
    volumes:
      - ../app:/workspace/app:ro
      - ../tests:/workspace/tests:ro
      - ../repos:/workspace/repos
      - ../output:/workspace/output
    working_dir: /workspace

# Named volumes for build-tool dependency caches.  Shared by
# the standalone and sidecar services so Maven/Gradle artifacts
# persist across ephemeral `docker compose run --rm` invocations.
volumes:
  maven-cache:
  gradle-cache:
