# DEPRECATED — use publish-containers.yml instead.
#
# This workflow is superseded by publish-containers.yml, which builds
# all four service images (sidecar, operator, spdx-indexing, sbom-tree)
# via a matrix strategy with the same GHCR namespace auto-detection.
#
# This file is retained temporarily for reference. Remove once
# publish-containers.yml is verified in CI.

name: "[DEPRECATED] Publish Sidecar Image"

# Disabled — triggers moved to publish-containers.yml
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/omnibor-sidecar

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sidecar image
        run: |
          docker build \
            --target sidecar \
            -f docker/Dockerfile \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Push to GHCR
        run: |
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"

      - name: Summary
        run: |
          echo "## Sidecar Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE_NAME:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE_NAME:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
