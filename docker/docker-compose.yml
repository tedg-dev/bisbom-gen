services:
  # --------------------------------------------------------
  # Standalone: full image with toolchains + bomtrace
  # Usage: docker compose up bisbom-standalone
  # --------------------------------------------------------
  bisbom-standalone:
    # REQUIRED: bomtrace3 needs x86 (sys/reg.h). Uses QEMU on Apple Silicon.
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: standalone
    image: bisbom-env:standalone
    # No fixed container_name: with `run --rm` it is unnecessary,
    # blocks concurrent runs, and collides with the bisbom-env
    # alias that extends this service.
    volumes:
      - ../repos:/workspace/repos
      - ../output:/workspace/output
      - ../app:/workspace/app
      - ../docs:/workspace/docs
      # Persist Maven/Gradle caches across ephemeral runs so
      # dependencies/plugins are downloaded once, not per run.
      - maven-cache:/root/.m2
      - gradle-cache:/root/.gradle
    working_dir: /workspace
    stdin_open: true
    tty: true
    # Bomtrace requires ptrace capability
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  # --------------------------------------------------------
  # Sidecar: minimal image (no toolchains, no SYS_PTRACE)
  # Usage: docker compose up bisbom-sidecar
  # --------------------------------------------------------
  bisbom-sidecar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: sidecar
    image: bisbom-env:sidecar
    volumes:
      - ../repos:/workspace/repos
      - ../output:/workspace/output
      - ../app:/workspace/app
      - ../docs:/workspace/docs
      # Persist Maven/Gradle caches across ephemeral runs so
      # dependencies/plugins are downloaded once, not per run.
      - maven-cache:/root/.m2
      - gradle-cache:/root/.gradle
    working_dir: /workspace
    stdin_open: true
    tty: true

  # --------------------------------------------------------
  # Default (backward compatible alias for standalone)
  # Usage: docker compose up bisbom-env
  # --------------------------------------------------------
  bisbom-env:
    extends:
      service: bisbom-standalone

  # --------------------------------------------------------
  # RHEL 9 (Rocky): integration testing for RpmResolver
  # Usage: docker compose run --rm bisbom-rhel pytest ...
  # --------------------------------------------------------
  bisbom-rhel:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.rhel
    image: bisbom-env:rhel9
    volumes:
      - ../app:/workspace/app:ro
      - ../tests:/workspace/tests:ro
      - ../repos:/workspace/repos
      - ../output:/workspace/output
    working_dir: /workspace

  # --------------------------------------------------------
  # Alpine 3.19: integration testing for ApkResolver
  # Usage: docker compose run --rm bisbom-alpine pytest ...
  # --------------------------------------------------------
  bisbom-alpine:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.alpine
    image: bisbom-env:alpine
    volumes:
      - ../app:/workspace/app:ro
      - ../tests:/workspace/tests:ro
      - ../repos:/workspace/repos
      - ../output:/workspace/output
    working_dir: /workspace

# Named volumes for build-tool dependency caches.  Shared by
# the standalone and sidecar services so Maven/Gradle artifacts
# persist across ephemeral `docker compose run --rm` invocations.
volumes:
  maven-cache:
  gradle-cache:
