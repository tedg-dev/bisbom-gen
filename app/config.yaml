repos:
  curl:
    url: https://github.com/curl/curl.git
    branch: curl-8_19_0
    language: c-cpp
    build_profile:
      tool: autotools
      structure: single-module
    build_steps:
    - autoreconf -fi
    - ./configure --with-openssl --with-zlib --with-nghttp2 --with-libssh2 --with-brotli
    - make -j$(nproc)
    clean_cmd: make clean
    description: HTTP transfer library and CLI tool (~170K LoC)
    output_binaries:
    - src/.libs/curl
    - lib/.libs/libcurl.so
    apt_deps:
    - libssl-dev
    - zlib1g-dev
    - libnghttp2-dev
    - libssh2-1-dev
    - libbrotli-dev
    - libpsl-dev
    - libzstd-dev
    - libc-ares-dev
    - libidn2-dev
    - libpcre2-dev
  ffmpeg:
    url: https://github.com/FFmpeg/FFmpeg.git
    branch: n8.1
    language: c-cpp
    build_profile:
      tool: make
      structure: single-module
      traits: [custom-configure]
    build_steps:
    - ./configure --enable-gpl --enable-nonfree --enable-shared --disable-static --enable-libx264 --enable-libx265 --enable-libvpx
      --enable-libopus --enable-libmp3lame --enable-libfdk-aac --enable-libfreetype --enable-libfontconfig --enable-libfribidi
      --enable-libass --enable-openssl
    - make -j1
    clean_cmd: make distclean
    description: Multimedia framework (~1.2M LoC, 20+ third-party libs)
    output_binaries:
    - ffmpeg
    - ffprobe
    - libavcodec/libavcodec.so
    - libavdevice/libavdevice.so
    - libavfilter/libavfilter.so
    - libavformat/libavformat.so
    - libavutil/libavutil.so
    - libswresample/libswresample.so
    - libswscale/libswscale.so
    apt_deps:
    - libssl-dev
    - libx264-dev
    - libx265-dev
    - libvpx-dev
    - libopus-dev
    - libmp3lame-dev
    - libfdk-aac-dev
    - libfreetype-dev
    - libfontconfig1-dev
    - libfribidi-dev
    - libass-dev
    - nasm
    - yasm
  nmap:
    url: https://github.com/nmap/nmap.git
    branch: 508531ed5904c2382ad25e908b75adc1374baaee  # nmap has no release tags; pinned to a commit SHA (upstream-pinning policy)
    language: c-cpp
    build_profile:
      tool: autotools
      structure: single-module
      traits: [vendored]
    build_steps:
    - ./configure --with-libpcre=/usr --with-libz=/usr --with-libssh2=/usr --with-openssl=/usr --with-libdnet=included --with-liblua=included --with-liblinear=included --without-zenmap --without-ndiff
    - make -j$(nproc)
    clean_cmd: make clean
    description: Network scanner with 10 vendored libs + 10+ dynamic system deps (~420 source files, C/C++)
    output_binaries:
    - nmap
    - ncat/ncat
    - nping/nping
    apt_deps:
    - libpcap-dev
    - flex
    - bison
    vendored_dirs:
    - /libdnet-stripped/
    - /liblinear/
    - /liblua/
    - /libnetutil/
    - /libpcap/
    - /libpcre/
    - /libssh2/
    - /libz/
    - /nbase/
    - /nsock/
  redis:
    url: https://github.com/redis/redis.git
    branch: "8.0.6"
    language: c-cpp
    build_profile:
      tool: make
      structure: single-module
      traits: [vendored]
    build_steps:
    - make -j$(nproc)
    clean_cmd: make clean
    description: In-memory data store with 8 vendored libs (jemalloc, lua, hiredis, etc.) (~293K LoC, C)
    output_binaries:
    - src/redis-server
    - src/redis-cli
    vendored_dirs:
    - /deps/fast_float/
    - /deps/fpconv/
    - /deps/hdr_histogram/
    - /deps/hiredis/
    - /deps/jemalloc/
    - /deps/linenoise/
    - /deps/lua/
    - /deps/xxhash/
  openosc:
    url: https://github.com/cisco/OpenOSC.git
    branch: v1.0.7
    language: c-cpp
    build_profile:
      tool: autotools
      structure: single-module
    build_steps:
    - autoreconf -vfi
    - ./configure --disable-safec
    - make -j$(nproc)
    clean_cmd: make clean
    description: Cisco Open Object Size Checking library — buffer overflow detection for C/C++ (v1.0.8, Apache 2.0)
    output_binaries:
    - src/.libs/libopenosc.so
    apt_deps:
    - autoconf
    - automake
    - libtool
  node:
    url: https://github.com/nodejs/node.git
    branch: v22.19.0
    language: c-cpp
    build_profile:
      tool: make
      structure: single-module
      traits: [gyp, vendored]
    build_steps:
    - ./configure
    - make -j$(nproc) CXXFLAGS='-Wno-error=unused-result'
    clean_cmd: make clean
    description: Node.js JavaScript runtime — V8, libuv, OpenSSL, zlib, nghttp2, llhttp all vendored in deps/ (~4M LoC)
    output_binaries:
    - out/Release/node
    apt_deps:
    - python3
    - python3-pip
    vendored_dirs:
    - /deps/openssl/
    - /deps/v8/
    - /deps/uv/
    - /deps/zlib/
    - /deps/nghttp2/
    - /deps/llhttp/
    - /deps/icu-small/
    - /deps/cares/
    - /deps/brotli/
    - /deps/ada/
    - /deps/simdjson/
    - /deps/simdutf/
    - /deps/ngtcp2/
    - /deps/base64/
    - /deps/nbytes/
    - /deps/ncrypto/
    - /deps/uvwasi/
    - /deps/acorn/
    - /deps/cjs-module-lexer/
    - /deps/undici/
  fzf:
    url: https://github.com/junegunn/fzf.git
    branch: v0.70.0
    language: go
    build_profile:
      tool: go
      structure: single-module
      traits: [go-modules]
    build_steps:
    - 'go build -a -trimpath -ldflags="-s -w" -o fzf .'
    clean_cmd: rm -f fzf
    description: Fuzzy finder CLI (~7 direct + 4 indirect Go deps)
    output_binaries:
    - fzf
  lazygit:
    url: https://github.com/jesseduffield/lazygit.git
    branch: v0.60.0
    language: go
    build_profile:
      tool: go
      structure: single-module
      traits: [go-modules]
    build_steps:
    - 'go build -a -trimpath -ldflags="-s -w" -o lazygit .'
    clean_cmd: rm -f lazygit
    description: Terminal UI for git (~15-20 direct + 20-30 indirect Go deps)
    output_binaries:
    - lazygit
  croc:
    url: https://github.com/schollz/croc.git
    branch: v10.4.2
    language: go
    build_profile:
      tool: go
      structure: single-module
      traits: [go-modules]
    build_steps:
    - 'go build -a -trimpath -ldflags="-s -w" -o croc .'
    clean_cmd: rm -f croc
    description: Secure file transfer tool (~10-15 direct + 15 indirect Go deps)
    output_binaries:
    - croc
  dive:
    url: https://github.com/wagoodman/dive.git
    branch: v0.13.1
    language: go
    build_profile:
      tool: go
      structure: single-module
      traits: [go-modules]
    build_steps:
    - 'go build -a -trimpath -ldflags="-s -w" -o dive_bin .'
    clean_cmd: rm -f dive_bin
    description: Docker image layer explorer (~15-20 direct + 25 indirect Go deps)
    output_binaries:
    - dive_bin
  gdu:
    url: https://github.com/dundee/gdu.git
    branch: v5.34.1
    language: go
    build_profile:
      tool: go
      structure: single-module
      traits: [go-modules]
    build_steps:
    - 'go build -a -trimpath -ldflags="-s -w" -o gdu ./cmd/gdu'
    clean_cmd: rm -f gdu
    description: Fast disk usage analyzer with TUI (~10-15 direct + 15-20 indirect Go deps)
    output_binaries:
    - gdu
  pocketbase:
    url: https://github.com/pocketbase/pocketbase.git
    branch: v0.25.9
    language: go
    build_profile:
      tool: go
      structure: single-module
      traits: [go-modules]
    build_steps:
    - 'go build -a -trimpath -ldflags="-s -w" -o pocketbase ./examples/base'
    clean_cmd: rm -f pocketbase
    description: Open source backend (Go, SQLite, REST API, auth, realtime subscriptions)
    output_binaries:
    - pocketbase
  oxipng:
    url: https://github.com/oxipng/oxipng.git
    branch: v10.1.0
    language: rust
    build_profile:
      tool: cargo
      structure: single-module
    build_steps:
    - cargo build --release
    clean_cmd: cargo clean
    description: Multithreaded lossless PNG optimizer (~12 direct Rust crate deps)
    output_binaries:
    - target/release/oxipng
  dura:
    url: https://github.com/tkellogg/dura.git
    branch: v0.2.0
    language: rust
    build_profile:
      tool: cargo
      structure: single-module
    build_steps:
    - cargo build --release
    clean_cmd: cargo clean
    description: Git background auto-commit tool (~42 direct + 35 transitive Rust crate deps, complex Git-binding layer)
    output_binaries:
    - target/release/dura
  jsoup:
    url: https://github.com/jhy/jsoup.git
    branch: jsoup-1.22.1
    language: java
    build_profile:
      tool: maven
      structure: single-module
      traits: [skip-tests]
    build_steps:
    - mvn package -DskipTests -q
    clean_cmd: mvn clean -q
    description: Java HTML parser library (zero runtime deps - all test scope)
    output_binaries:
    - '**/target/*.jar'
  checkstyle:
    url: https://github.com/checkstyle/checkstyle.git
    branch: checkstyle-13.3.0
    language: java
    build_profile:
      tool: maven
      structure: single-module
      traits: [skip-tests]
    build_steps:
    - mvn package -DskipTests -q
    clean_cmd: mvn clean -q
    description: Static analysis tool (14 direct, 12 transitive - antlr, guava, picocli, commons-beanutils)
    output_binaries:
    - '**/target/*.jar'
  crawler4j:
    url: https://github.com/yasserg/crawler4j.git
    branch: crawler4j-4.4.0
    language: java
    build_profile:
      tool: maven
      structure: multi-module
      traits: [reactor, skip-tests]
    build_steps:
    - mvn package -DskipTests -q -pl crawler4j
    clean_cmd: mvn clean -q
    description: Open source web crawler (42 direct, 35 transitive - Apache HttpComponents, Tika, SLF4J, deep hierarchy)
    output_binaries:
    - '**/target/*.jar'
  dependency-check:
    url: https://github.com/jeremylong/DependencyCheck.git
    branch: v9.2.0
    language: java
    build_profile:
      tool: maven
      structure: multi-module
      traits: [reactor, also-make, skip-tests]
    build_steps:
    - mvn package -DskipTests -q -pl cli -am
    clean_cmd: mvn clean -q
    description: OWASP dependency-check CLI (6 modules - utils, core, cli, ant, maven, archetype)
    output_binaries:
    - '**/target/*.jar'
  logging-log4j2:
    url: https://github.com/apache/logging-log4j2.git
    branch: rel/2.24.3
    language: java
    build_profile:
      tool: maven
      structure: multi-module
      traits: [reactor, also-make, skip-tests]
    build_steps:
    - env JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 mvn install -DskipTests -q -pl log4j-api-java9,log4j-core-java9,log4j-core -am
    clean_cmd: mvn clean -q
    description: Apache Log4j2 logging framework (Maven multi-module, ~30 modules, building log4j-core + log4j-api, requires JDK 17)
    output_binaries:
    - '**/target/*.jar'
  spring-boot:
    url: https://github.com/spring-projects/spring-boot.git
    branch: v3.4.4
    language: java
    build_profile:
      tool: gradle
      structure: multi-module
      dsl: groovy
      tool_version: "8.13"
      traits: [dependency-management]
    build_steps:
    - ./gradlew :spring-boot-project:spring-boot:build -x test -x check --no-daemon -q
    clean_cmd: ./gradlew clean --no-daemon -q
    description: Spring Boot framework (Gradle multi-module, building core spring-boot module)
    output_binaries:
    - '**/build/libs/*.jar'
  bc-java:
    url: https://github.com/bcgit/bc-java.git
    branch: r1rv84
    language: java
    build_profile:
      tool: gradle
      structure: multi-module
      dsl: groovy
      tool_version: "9.1.0"
      traits: [multi-release-jar]
    build_steps:
    - ./gradlew :prov:build -x test -x compileJava25Java --no-daemon -q
    clean_cmd: ./gradlew clean --no-daemon -q
    description: Bouncy Castle crypto library (Gradle multi-module, building bcprov provider, JDK 21, Java25 MR classes excluded)
    output_binaries:
    - '**/build/libs/*.jar'
  bisbom-java-testapp:
    url: https://github.com/tedg-dev/bisbom-java-testapp.git
    branch: 44849358dcedc486620eb3cdd78afe147f596c0d  # our testapp has no release tags; pinned to a commit SHA
    language: java
    build_profile:
      tool: maven
      structure: single-module
      traits: [skip-tests]
    build_steps:
    - mvn package -DskipTests -q
    clean_cmd: mvn clean -q
    description: CI/CD sidecar integration test app (jsoup + log4j2 + bouncy-castle, Maven, tested on Amazon Linux 2023 / Corretto 21)
    output_binaries:
    - '**/target/*.jar'
  caffeine:
    url: https://github.com/ben-manes/caffeine.git
    branch: v3.2.4
    language: java
    build_profile:
      tool: gradle
      structure: multi-module
      dsl: kotlin
      tool_version: "9.5.0"
      traits: [version-catalog, composite-build]
    build_steps:
    - ./gradlew :caffeine:jar --no-daemon -q
    clean_cmd: ./gradlew clean --no-daemon -q
    description: Caffeine high-performance caching library (Gradle Kotlin DSL, version catalog, composite build; building core caffeine module)
    output_binaries:
    - '**/build/libs/*.jar'
  opentelemetry-java:
    url: https://github.com/open-telemetry/opentelemetry-java.git
    branch: v1.64.0
    language: java
    build_profile:
      tool: gradle
      structure: multi-module
      dsl: kotlin
      tool_version: "9.6.1"
      traits: [bom]
    build_steps:
    - ./gradlew :api:all:jar --no-daemon -q
    clean_cmd: ./gradlew clean --no-daemon -q
    description: OpenTelemetry Java API/SDK (Gradle Kotlin DSL, multi-module, Gradle 9.6.1; building opentelemetry-api :api:all)
    output_binaries:
    - '**/build/libs/*.jar'
    # :custom-checks is a normal subproject holding OTel's internal Error
    # Prone checks applied to its own build — it ships in no published
    # artifact, so exclude its JAR from the product set.
    exclude_binaries:
    - '**/custom-checks/build/libs/*.jar'
  rxjava:
    url: https://github.com/ReactiveX/RxJava.git
    branch: v3.1.10
    language: java
    build_profile:
      tool: gradle
      structure: single-module
      dsl: groovy
      tool_version: "7.6.4"
      java_home: /usr/lib/jvm/java-17-openjdk-amd64
    build_steps:
    - ./gradlew jar --no-daemon -q
    clean_cmd: ./gradlew clean --no-daemon -q
    description: RxJava reactive extensions (Gradle Groovy DSL, single-module, Gradle 7.6.4 enterprise floor; runs on JDK 17 — Gradle 7.6 max supported JDK is 19)
    output_binaries:
    - '**/build/libs/*.jar'
paths:
  repos_dir: /workspace/repos
  output_dir: /workspace/output
  docs_dir: /workspace/docs
  bomsh_dir: /opt/bomsh
bisbom:
  tracer: bomtrace3
  create_bom_script: bomsh_create_bom.py
  sbom_script: bomsh_sbom.py
  raw_logfile: /tmp/bomsh_hook_raw_logfile.sha1
bisbom_rust:
  tracer: bomtrace2
  create_bom_script: bomsh_create_bom.py
  sbom_script: bomsh_sbom.py
  raw_logfile: /tmp/bomsh_hook_raw_logfile.sha1
bisbom_go:
  tracer: bomtrace2 -c /opt/bomsh/bin/bomtrace_go.conf
  create_bom_script: bomsh_create_bom.py
  sbom_script: bomsh_sbom.py
  raw_logfile: /tmp/bomsh_hook_raw_logfile.sha1
bisbom_java:
  # Java uses strace + bomsh_create_bom_java.py (post-build analysis)
  # instead of bomtrace (build-time interception)
  strace_opts: -f -s99999 --seccomp-bpf -e trace=openat -qqq
  create_bom_script: bomsh_create_bom_java.py
  strace_logfile: /tmp/strace_java_logfile
  # Sidecar inline hashing (generic, Maven + Gradle). The default path:
  # the LD_PRELOAD shim (libbisbom_java_intercept.so) computes each
  # .class/.jar git-blob SHA-1 + SHA-256 gitoid inline during the build
  # and generate_adg() assembles the treedb from the capture log instead
  # of a post-build workspace rescan. The native build is untouched
  # (env-only injection). This is the mandatory inline path (design C4):
  # on a platform where the shim cannot interpose (musl/Alpine or a
  # statically-linked launcher, design V4) the inline path fails loudly;
  # set this to false to force the legacy post-build rescan on such hosts.
  # See docs/sidecar/java/reference/inline-hashing-interception-design.md.
  java_inline_hash: true
  # Optional override; defaults to
  # /opt/bisbom/lib/libbisbom_java_intercept.so in the image.
  # inline_shim_path: /opt/bisbom/lib/libbisbom_java_intercept.so
pipeline:
  # Syft manifest-based SBOM generation.  Disabled by default
  # because build-interception build-time SBOMs are the primary output.
  # Enable for supplementary manifest-based baseline comparison.
  syft_enabled: false
docs:
  timestamp_format: '%Y-%m-%d_%H%M'
  types:
  - build
  - bisbom
  - spdx
  - binary-scan
  - comparison
  - runtime
